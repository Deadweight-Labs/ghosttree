version: 2
project_name: ghosttree

before:
  hooks:
    - go mod download

builds:
  - id: ctx
    main: ./cmd/ctx
    binary: ctx
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - ids: [ctx]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

source:
  enabled: true

sboms:
  - id: archives
    artifacts: archive
  - id: source
    artifacts: source

signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    output: true
  # The second signature, the one install.sh checks (REQ-723, DEC-56): minisign,
  # key in the release workflow's secrets. The key has no password; the
  # "trusted comment" names the tag, so a genuine list of another release does
  # not pass for this one.
  - id: minisign
    cmd: minisign
    artifacts: checksum
    signature: "${artifact}.minisig"
    args:
      - -S
      - -s
      - "{{ .Env.MINISIGN_KEY_FILE }}"
      - -m
      - "${artifact}"
      - -x
      - "${signature}"
      - -t
      - "ghosttree {{ .Tag }}"
    # The key has a password (RELEASING.md); minisign reads it from stdin.
    stdin: "{{ .Env.MINISIGN_PASSWORD }}"
    output: true

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^test"

release:
  # A draft: the workflow publishes it only after the signature of the uploaded
  # files has been checked (the last steps of release.yml).
  draft: true
  prerelease: auto
  # The installer and the key it checks with, next to the archives, so a
  # release can be installed from its own files.
  extra_files:
    - glob: deploy/downloads/ghosttree/install.sh
    - glob: deploy/downloads/ghosttree/minisign.pub
