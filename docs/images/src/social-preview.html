<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ghosttree social preview</title>
<style>
  /* Rendered at 1280x640 by render-social-preview.sh. Fonts: Fira Sans Condensed Heavy and IBM Plex Sans
     (both OFL, in fonts/). social-briefing.png is a crop of the "Agent context" page of the Northwind demo
     (film/make.sh), 2x, starting at x=640, y=400 of a 1280x800 window. */
  @font-face { font-family: 'Weight'; src: url('fonts/fira-condensed-heavy.woff2') format('woff2'); font-weight: 900; }
  @font-face { font-family: 'Plex'; src: url('fonts/plex-medium.woff2') format('woff2'); font-weight: 500; }
  :root { --blue: #2345c7; --yellow: #eed46c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--blue); color: #fff; }
  .lock { position: absolute; left: 70px; top: 60px; display: flex; align-items: center; gap: 13px; font: 900 40px/1 'Weight', sans-serif; }
  .lock svg { width: 42px; height: 42px; }
  h1 { position: absolute; left: 70px; top: 160px; width: 600px; font: 900 82px/1.02 'Weight', sans-serif; letter-spacing: -0.02em; }
  h1 span { background: var(--yellow); color: #000; padding: 0 .1em; }
  p { position: absolute; left: 70px; bottom: 56px; width: 560px; font: 500 22px/1.35 'Plex', sans-serif; color: #dfe5fb; }
  .win { position: absolute; left: 700px; top: 120px; width: 680px; height: 580px; overflow: hidden; background: #fff;
    border-radius: 14px 14px 0 0; box-shadow: 0 30px 70px rgba(6, 18, 70, .4); }
  .win img { position: absolute; left: 0; top: 0; width: 680px; }
  .hl { position: absolute; left: 211px; top: 259px; width: 458px; height: 20px; background: var(--yellow); mix-blend-mode: multiply; border-radius: 3px; }
</style>
</head>
<body>
  <div class="lock"><svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#fff" d="M6 29V14.5C6 8.7 10.5 4 16 4s10 4.7 10 10.5V29l-3.4-2.6L19.2 29 16 26.4 12.8 29l-3.4-2.6z"/><circle cx="12" cy="14.5" r="2" fill="#2345c7"/><circle cx="20" cy="14.5" r="2" fill="#2345c7"/></svg>Ghosttree</div>
  <h1>Context for coding agents that stays <span>true.</span></h1>
  <p>Self-hosted. Works with Claude Code, Codex and OpenCode.</p>
  <div class="win"><img src="social-briefing.png" alt=""><div class="hl"></div></div>
</body>
</html>
