<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ghosttree social preview</title>
<style>
  /* Rendered at 1280x640 by render-social-preview.sh. Fonts: IBM Plex Sans (OFL),
     with Helvetica/Arial as fallback. The screenshot is docs/images/ui-room.png. */
  :root {
    --bg: #eaeef7;
    --ink: #161c2d;
    --muted: #4a536b;
    --accent: #1e4fb8;
    --line: #c9d1e4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    position: relative;
  }
  .text {
    position: absolute;
    left: 72px;
    top: 64px;
    width: 640px;
    height: 512px;
    display: flex;
    flex-direction: column;
  }
  .name {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .name span { color: var(--accent); }
  h1 {
    margin-top: 40px;
    font-size: 56px;
    line-height: 1.14;
    font-weight: 600;
    letter-spacing: -1px;
  }
  .sub {
    margin-top: 28px;
    font-size: 32px;
    line-height: 1.3;
    color: var(--muted);
    font-weight: 500;
  }
  .pillars {
    margin-top: auto;
    display: flex;
    gap: 14px;
  }
  .pillars div {
    font-size: 24px;
    font-weight: 600;
    padding: 9px 22px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: #fff;
  }
  .shot {
    position: absolute;
    left: 760px;
    top: 120px;
    width: 640px;
    height: 600px;
    border-radius: 18px;
    background: #fff;
    border: 2px solid var(--line);
    box-shadow: 0 18px 40px rgba(22, 28, 45, 0.18);
    overflow: hidden;
  }
  .shot img {
    position: absolute;
    width: 1262px;
    left: -306px;
    top: -430px;
  }
</style>
</head>
<body>
  <div class="text">
    <div class="name">Ghost<span>tree</span></div>
    <h1>One memory, one work ledger, one room, for every coding agent on your team.</h1>
    <p class="sub">Self-hosted, and none of it in your repo.</p>
    <div class="pillars"><div>Remember</div><div>Work</div><div>Coordinate</div></div>
  </div>
  <div class="shot"><img src="ui-room.png" alt=""></div>
</body>
</html>
