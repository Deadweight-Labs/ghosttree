name: CI

on:
  push:
    branches: [dev, main, "release/**", "hotfix/**"]
  pull_request:
    branches: [dev, main, "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The race detector makes the suite about eight times slower. Pull requests run
# every test without it plus the concurrency tests with it; pushes to dev, main,
# release and hotfix branches run everything under the race detector.
env:
  RACE: ${{ github.event_name == 'push' && '-race' || '' }}
  RACE_SUBSET: Concurren|Race|Racing|Parallel|Simultan|Contend|SSE|Stream|Revoked|Drain|Shutdown|SIGTERM|Cursor|Writer|Pool|Queue|Crash|Watch|Lease|Lock

jobs:
  policy:
    name: Pull request policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch flow, title, release impact, and CLA
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -eu
          case "$BASE:$HEAD" in
            dev:*) ;;
            main:release/*|main:hotfix/*) ;;
            release/*:*) ;;
            *) echo "Pull requests target dev or release/*; only release/* and hotfix/* target main."; exit 1 ;;
          esac
          printf '%s\n' "$PR_TITLE" | grep -Eq '^(feat|fix|docs|test|build|ci|chore|refactor|perf|revert)(\([a-z0-9._-]+\))?!?: .+'
          case "$PR_AUTHOR:$HEAD" in
            "dependabot[bot]:dependabot/"*) exit 0 ;;
          esac
          test "$(printf '%s\n' "$PR_BODY" | grep -Ec "^- \[[xX]\] \`(major|minor|patch|none)\`")" -eq 1
          printf '%s\n' "$PR_BODY" | grep -Eq '^- \[[xX]\] I have read and agree to the .*Contributor License Agreement'

  go-checks:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(find cmd internal skills -name '*.go' -type f -print0 | xargs -0 gofmt -l)"
      - name: Vet
        run: go vet ./...
      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check planned version
        run: grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$' VERSION
      - name: Cross-build supported targets
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -o /tmp/ctx-${target%/*}-${target#*/} ./cmd/ctx
          done

  go-test-web:
    name: Go tests (web)
    runs-on: ubuntu-latest
    # Test databases live in RAM: on the runner's disk every migration commit
    # waits for fsync, which made opening one fresh store take seconds.
    env:
      TMPDIR: /dev/shm
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test web
        run: go test ${{ env.RACE }} -count=1 -timeout 70m ./internal/web/
      - name: Test web concurrency with race detector
        if: github.event_name == 'pull_request'
        run: go test -race -count=1 -timeout 20m -run "$RACE_SUBSET" ./internal/web/

  go-test-rest:
    name: Go tests (rest)
    runs-on: ubuntu-latest
    # Test databases live in RAM: on the runner's disk every migration commit
    # waits for fsync, which made opening one fresh store take seconds.
    env:
      TMPDIR: /dev/shm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test all packages except store and web
        run: go test ${{ env.RACE }} -count=1 -timeout 50m $(go list ./... | grep -v -e '/internal/store$' -e '/internal/web$')
      - name: Test concurrency with race detector (all packages except store and web)
        if: github.event_name == 'pull_request'
        run: go test -race -count=1 -timeout 20m -run "$RACE_SUBSET" $(go list ./... | grep -v -e '/internal/store$' -e '/internal/web$')

  go-test-store:
    name: Go tests (store)
    runs-on: ubuntu-latest
    # Test databases live in RAM: on the runner's disk every migration commit
    # waits for fsync, which made opening one fresh store take seconds.
    env:
      TMPDIR: /dev/shm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test store
        run: go test -count=1 -timeout 20m ./internal/store/
      - name: Test store concurrency with race detector
        run: go test -race -count=1 -timeout 30m -run 'Concurren|Race|Racing|Contend|Admission|Writer|Pool|Runtime|Crash|Drain|Queue|AtomicAndStable' ./internal/store/

  # Required status check of dev and main; it only summarises the parallel Go jobs.
  quality:
    name: Go quality
    if: always()
    needs: [go-checks, go-test-web, go-test-rest, go-test-store]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All Go jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress README.md CONTRIBUTING.md SECURITY.md RELEASING.md CLA.md COMMUNITY-GRANT.md COMMERCIAL.md docs/*.md
          fail: true
