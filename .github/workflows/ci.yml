name: CI

on:
  push:
    branches: [dev, main, "release/**", "hotfix/**"]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Pull request policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch flow, title, release impact, and CLA
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -eu
          case "$BASE:$HEAD" in
            dev:*) ;;
            main:release/*|main:hotfix/*) ;;
            *) echo "Pull requests target dev; only release/* and hotfix/* target main."; exit 1 ;;
          esac
          printf '%s\n' "$PR_TITLE" | grep -Eq '^(feat|fix|docs|test|build|ci|chore|refactor|perf|revert)(\([a-z0-9._-]+\))?!?: .+'
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            exit 0
          fi
          test "$(printf '%s\n' "$PR_BODY" | grep -Ec "^- \[[xX]\] \`(major|minor|patch|none)\`")" -eq 1
          printf '%s\n' "$PR_BODY" | grep -Eq '^- \[[xX]\] I have read and agree to the .*Contributor License Agreement'

  quality:
    name: Go quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(find cmd internal skills -name '*.go' -type f -print0 | xargs -0 gofmt -l)"
      - name: Vet
        run: go vet ./...
      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check planned version
        run: grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$' VERSION
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Cross-build supported targets
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -o /tmp/ctx-${target%/*}-${target#*/} ./cmd/ctx
          done

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress README.md CONTRIBUTING.md SECURITY.md RELEASING.md CLA.md COMMUNITY-GRANT.md COMMERCIAL.md
          fail: true
