name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 70
    # The environment holds the signing key (secret MINISIGN_SECRET_KEY) and is
    # limited to v* tags; only admins can create those (repository ruleset). A
    # branch, a pull request or any other workflow never sees the key.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Nothing after this needs the job token in .git/config; the actions
          # below are other people's code.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate immutable release tag and source branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$'
          test "$(git cat-file -t "$TAG")" = tag
          version=${TAG#v}
          test "$(cat VERSION)" = "$version"
          base=${version%%-rc.*}
          if printf '%s\n' "$TAG" | grep -q -- '-rc\.'; then
            git branch -r --contains HEAD | sed 's/^[* ]*//' | grep -Fxq "origin/release/$base"
          else
            git branch -r --contains HEAD | sed 's/^[* ]*//' | grep -Fxq "origin/main"
          fi
      # The key is also published in SECURITY.md, a second place next to install.sh
      # to compare it with: a release whose key nobody can check there stops here.
      - name: Check that SECURITY.md carries the release key
        run: |
          set -eu
          pub=$(sed -n 2p deploy/downloads/ghosttree/minisign.pub)
          grep -Fq "\`$pub\`" SECURITY.md || { echo "SECURITY.md does not carry the release key $pub" >&2; exit 1; }
      # The scripts of the web interface come first: a second, and a script that
      # loops is stopped by the limits.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test interface scripts
        run: timeout 60 node --max-old-space-size=300 --test --test-timeout=20000 internal/web/jstest/*.test.mjs
      # Same tests as the push run in ci.yml, one after the other. The test
      # databases live in RAM: on the runner's disk every migration commit waits
      # for fsync (see ci.yml).
      - name: Test web with race detector
        env:
          TMPDIR: /dev/shm
        run: go test -race -count=1 -timeout 35m ./internal/web/
      - name: Test with race detector (all packages except store and web)
        env:
          TMPDIR: /dev/shm
        run: go test -race -count=1 -timeout 30m $(go list ./... | grep -v -e '/internal/store$' -e '/internal/web$')
      - name: Test store
        env:
          TMPDIR: /dev/shm
        run: go test -count=1 -timeout 20m ./internal/store/
      - name: Test store concurrency with race detector
        env:
          TMPDIR: /dev/shm
        run: go test -race -count=1 -timeout 30m -run 'Concurren|Race|Racing|Contend|Admission|Writer|Pool|Runtime|Crash|Drain|Queue|AtomicAndStable' ./internal/store/
      # The key that signs checksums.txt for install.sh (DEC-56) is the secret
      # MINISIGN_SECRET_KEY of the environment "release" (the content of the .key
      # file made with `minisign -G -W`). It is not touched here: this step only
      # makes sure the installer carries a real public key and installs minisign.
      # The secret is written to a file in the step right before goreleaser and
      # removed in the step right after it, so the only action that runs with
      # the key on disk is goreleaser, which signs with it.
      - name: Check the public key and install minisign
        run: |
          set -eu
          if grep -q '__GHOSTTREE_MINISIGN_PUBKEY__' deploy/downloads/ghosttree/minisign.pub deploy/downloads/ghosttree/install.sh internal/releasekey/minisign.pub; then
            echo "install.sh, minisign.pub and internal/releasekey/minisign.pub still carry the key placeholder" >&2; exit 1
          fi
          pub=$(sed -n 2p deploy/downloads/ghosttree/minisign.pub)
          grep -Fq "pubkey='$pub'" deploy/downloads/ghosttree/install.sh
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Only this step sees the secret. The key goes to a file for the signing
      # run of goreleaser and is deleted by the step after it. A key that does not
      # match minisign.pub stops the release before anything is published.
      - name: Write the minisign key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -eu
          test -n "$MINISIGN_SECRET_KEY" || { echo "secret MINISIGN_SECRET_KEY is not set" >&2; exit 1; }
          test -n "$MINISIGN_PASSWORD" || { echo "secret MINISIGN_PASSWORD is not set: the release key has a password" >&2; exit 1; }
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          printf 'probe\n' > "$RUNNER_TEMP/probe"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m "$RUNNER_TEMP/probe" -x "$RUNNER_TEMP/probe.minisig" -t probe
          minisign -V -p deploy/downloads/ghosttree/minisign.pub -m "$RUNNER_TEMP/probe" -x "$RUNNER_TEMP/probe.minisig"
          rm -f "$RUNNER_TEMP/probe" "$RUNNER_TEMP/probe.minisig"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_KEY_FILE: ${{ runner.temp }}/minisign.key
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      - name: Remove the minisign key
        if: always()
        run: rm -f "$RUNNER_TEMP/minisign.key"
      - name: Check the published signature
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          minisign -V -p deploy/downloads/ghosttree/minisign.pub -m dist/checksums.txt -x dist/checksums.txt.minisig
          grep -Fq "ghosttree $TAG" dist/checksums.txt.minisig
      # goreleaser left the release as a draft (.goreleaser.yaml). The files that
      # were really uploaded are fetched back and checked: signature against the
      # committed key, the tag in the signed comment, every archive against the
      # signed list. A failure leaves a draft to delete, not a release that people
      # can install.
      - name: Check the uploaded files of the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          up="$RUNNER_TEMP/uploaded"
          mkdir "$up"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$up" \
            --pattern checksums.txt --pattern checksums.txt.minisig --pattern 'ghosttree_*.tar.gz'
          minisign -V -p deploy/downloads/ghosttree/minisign.pub -m "$up/checksums.txt" -x "$up/checksums.txt.minisig"
          grep -Fq "ghosttree $TAG" "$up/checksums.txt.minisig"
          cmp "$up/checksums.txt" dist/checksums.txt
          archives=0
          for f in "$up"/ghosttree_*.tar.gz; do
            grep -Fq "  $(basename "$f")" "$up/checksums.txt"
            archives=$((archives + 1))
          done
          test "$archives" -ge 4
          (cd "$up" && sha256sum -c checksums.txt --ignore-missing)
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
