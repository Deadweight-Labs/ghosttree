name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish signed release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate immutable release tag and source branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$'
          test "$(git cat-file -t "$TAG")" = tag
          version=${TAG#v}
          test "$(cat VERSION)" = "$version"
          base=${version%%-rc.*}
          if printf '%s\n' "$TAG" | grep -q -- '-rc\.'; then
            git branch -r --contains HEAD | sed 's/^[* ]*//' | grep -Fxq "origin/release/$base"
          else
            git branch -r --contains HEAD | sed 's/^[* ]*//' | grep -Fxq "origin/main"
          fi
      - name: Test release commit
        run: go test -race -count=1 ./...
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
