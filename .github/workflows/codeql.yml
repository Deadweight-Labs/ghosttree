name: CodeQL

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "43 3 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@397b4764c5bc24305eb8b7267d26b1f20ed9f986 # v3.30.4
        with:
          languages: go
      - uses: github/codeql-action/autobuild@397b4764c5bc24305eb8b7267d26b1f20ed9f986 # v3.30.4
      - uses: github/codeql-action/analyze@397b4764c5bc24305eb8b7267d26b1f20ed9f986 # v3.30.4
