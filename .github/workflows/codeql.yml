name: CodeQL

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "43 3 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@397b4764c5bc24305eb8b7267d26b1f20ed9f986 # v3.30.4
        with:
          languages: go
      - uses: github/codeql-action/autobuild@397b4764c5bc24305eb8b7267d26b1f20ed9f986 # v3.30.4
      - uses: github/codeql-action/analyze@397b4764c5bc24305eb8b7267d26b1f20ed9f986 # v3.30.4
